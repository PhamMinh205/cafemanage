services:
  postgres:
    image: postgres:15-alpine
    container_name: cwd_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cwd_password
      POSTGRES_DB: cwd_db
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./cwd-backend/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: cwd_redis
    restart: always
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./cwd-backend
      dockerfile: Dockerfile
    image: cwd-backend:latest
    container_name: cwd_backend
    restart: unless-stopped
    env_file:
      - ./cwd-backend/.env
    depends_on:
      - postgres
      - redis
    ports:
      - '5000:5000'
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: cwd_password
      DB_NAME: cwd_db
      REDIS_URL: redis://redis:6379
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http'); const req=http.get('http://localhost:5000/health', res => process.exit(res.statusCode===200?0:1)); req.on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    profiles:
      - prod
    build:
      context: ./cwd-frontend
      dockerfile: Dockerfile
    image: cwd-frontend:latest
    container_name: cwd_frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    environment:
      - VITE_API_BASE=http://backend:5000/api
    depends_on:
      - backend

volumes:
  pgdata:
