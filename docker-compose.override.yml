services:
  backend:
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
    volumes:
      - ./cwd-backend:/usr/src/app
      - /usr/src/app/node_modules
    command: sh -c "npm install && npm run dev:wait"
    ports:
      - '5000:5000'

  frontend_dev:
    image: node:20-alpine
    working_dir: /app
    environment:
      NODE_ENV: development
      VITE_BACKEND_URL: http://backend:5000
      VITE_API_BASE: /api
    volumes:
      - ./cwd-frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - '5173:5173'
    depends_on:
      - backend
